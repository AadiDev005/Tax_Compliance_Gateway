global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'tax-engine'
    static_configs:
      - targets: ['tax-engine:8082']

  - job_name: 'document-service'
    static_configs:
      - targets: ['document-service:8083']

  - job_name: 'audit-service'
    static_configs:
      - targets: ['audit-service:8084']

  - job_name: 'regulatory-service'
    static_configs:
      - targets: ['regulatory-service:8085']

  - job_name: 'business-portal'
    static_configs:
      - targets: ['business-portal:8086']
